<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY CLOSETY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>MY CLOSETY</h1>
        <p class="subtitle">
            あなたの持っている服からコーデを提案します
        </p>

        <section class="card">

            <h2>👕 服を登録する</h2>

            <label for="clothesImage" class="upload-button">
                📷 服の写真を選択
            </label>

            <input
                type="file"
                id="clothesImage"
                accept="image/*"
                multiple
            >

            <p class="hint">
                複数の服を選択できます
            </p>

            <div id="preview" class="preview"></div>

        </section>


        <section class="card">

            <h2>🤖 コーデ条件</h2>

            <div class="input-group">
                <label for="temperature">気温</label>
                <input
                    type="number"
                    id="temperature"
                    placeholder="25"
                >
                <span>℃</span>
            </div>

            <div class="input-group">
                <label for="purpose">目的</label>
                <select id="purpose">
                    <option value="普段着">普段着</option>
                    <option value="大学">大学</option>
                    <option value="仕事">仕事</option>
                    <option value="デート">デート</option>
                    <option value="遊び">遊び</option>
                </select>
            </div>

            <div class="input-group">
                <label for="style">系統</label>
                <select id="style">
                    <option value="カジュアル">カジュアル</option>
                    <option value="ストリート">ストリート</option>
                    <option value="きれいめ">きれいめ</option>
                    <option value="シンプル">シンプル</option>
                    <option value="おまかせ">おまかせ</option>
                </select>
            </div>

            <button id="analyzeButton">
                AIにコーデを提案してもらう
            </button>

        </section>


        <section id="resultSection" class="card result-card">

            <h2>✨ AIの提案</h2>

            <div id="result">
                <p class="empty">
                    服を登録して「AIにコーデを提案してもらう」を押してください。
                </p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
